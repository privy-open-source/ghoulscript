name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Use EMSDK
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ vars.EM_VERSION || '6.0.6' }}
          actions-cache-folder: '.emsdk'

      - name: Use Corepack
        run: corepack enable

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "yarn"

      - name: Install Deps
        run: yarn install --immutable

      - name: Build Package
        run: yarn workspace @privyid/ghoulscript build

      - name: Build Playground
        run: yarn workspace @privyid/ghoulscript-sample build

      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playground/sample/dist
          cname: ghoulscript.privy.id
          force_orphan: true
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
